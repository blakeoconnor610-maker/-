<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1b1e">
<link rel="manifest" href="/manifest.json">
<title>server panel</title>
<style>
  :root {
    --bg: #1a1b1e; --panel: #232529; --line: #33363c;
    --text: #e6e7ea; --dim: #9aa0a8; --accent: #a9b7e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 12px 14px; border-bottom: 1px solid var(--line);
    display: flex; gap: 10px; align-items: center; flex-shrink: 0;
  }
  header b { font-weight: 600; letter-spacing: .08em; }
  select, input, textarea, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  select { flex: 1; min-width: 0; }
  button { background: var(--accent); color: #16181c; border: none; font-weight: 600; }
  button:disabled { opacity: .5; }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; }
  .msg .who { color: var(--dim); font-size: 12px; margin-bottom: 2px; }
  .msg .body {
    background: var(--panel); padding: 8px 11px; border-radius: 12px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.mine { align-self: flex-end; }
  .msg.mine .body { background: #33405e; }
  footer {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); flex-shrink: 0;
  }
  textarea { flex: 1; resize: none; max-height: 120px; }
  #login { margin: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; width: min(340px, 90vw); }
  #login h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: .08em; }
  .note { color: var(--dim); font-size: 13px; }
  .hide { display: none !important; }
</style>
</head>
<body>

<div id="login">
  <h1>server panel</h1>
  <p class="note">the password is whatever you put in PANEL_PASSWORD.</p>
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button onclick="login()">log in</button>
  <p class="note" id="loginerr"></p>
</div>

<header class="hide" id="bar">
  <b>panel</b>
  <select id="channel" onchange="loadHistory()"></select>
  <button onclick="loadHistory()">refresh</button>
</header>

<div id="log" class="hide"></div>

<footer class="hide" id="composer">
  <textarea id="text" rows="1" placeholder="type here, it sends as the bot"></textarea>
  <button id="sendbtn" onclick="send()">send</button>
</footer>

<script>
const $ = (id) => document.getElementById(id);

async function api(path, options) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
  if (res.status === 401) { showLogin(); throw new Error("unauthorised"); }
  return res.json();
}

function showLogin() {
  $("login").classList.remove("hide");
  ["bar", "log", "composer"].forEach(id => $(id).classList.add("hide"));
}

function showPanel() {
  $("login").classList.add("hide");
  ["bar", "log", "composer"].forEach(id => $(id).classList.remove("hide"));
}

async function login() {
  const body = JSON.stringify({ password: $("pw").value });
  const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body });
  if (!res.ok) { $("loginerr").textContent = "that password is wrong"; return; }
  await boot();
}

async function boot() {
  const who = await (await fetch("/api/whoami")).json();
  if (!who.authed) { showLogin(); return; }
  showPanel();
  const data = await api("/api/channels");
  const select = $("channel");
  select.innerHTML = "";
  for (const channel of data.channels) {
    const option = document.createElement("option");
    option.value = channel.id;
    option.textContent = `${channel.guild} / ${channel.name}`;
    select.appendChild(option);
  }
  if (data.channels.length) loadHistory();
}

async function loadHistory() {
  const id = $("channel").value;
  if (!id) return;
  const data = await api("/api/history?channel=" + id);
  const log = $("log");
  log.innerHTML = "";
  for (const message of (data.messages || [])) {
    const wrap = document.createElement("div");
    wrap.className = "msg" + (message.mine ? " mine" : "");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = `${message.author} - ${message.at}`;
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = message.content || "(no text)";
    wrap.append(who, body);
    log.appendChild(wrap);
  }
  log.scrollTop = log.scrollHeight;
}

async function send() {
  const content = $("text").value.trim();
  if (!content) return;
  $("sendbtn").disabled = true;
  try {
    const result = await api("/api/send", {
      method: "POST",
      body: JSON.stringify({ channel: $("channel").value, content })
    });
    if (result.error) { alert(result.error); }
    else { $("text").value = ""; await loadHistory(); }
  } finally {
    $("sendbtn").disabled = false;
  }
}

$("text").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); }
});
$("pw").addEventListener("keydown", (event) => { if (event.key === "Enter") login(); });

boot();
setInterval(() => { if (!$("log").classList.contains("hide")) loadHistory(); }, 15000);
</script>
</body>
</html>
