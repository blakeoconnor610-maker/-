<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1b1e">
<link rel="manifest" href="/manifest.json">
<title>server panel</title>
<style>
  :root {
    --bg: #1a1b1e; --panel: #232529; --line: #33363c;
    --text: #e6e7ea; --dim: #9aa0a8; --accent: #a9b7e0;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex; flex-direction: column; height: 100dvh;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  header {
    padding: 10px 12px; border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center; flex-shrink: 0;
  }
  select, input, textarea, button {
    font: inherit; color: var(--text); background: var(--panel);
    border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  select { flex: 1; min-width: 0; }
  button { background: var(--accent); color: #16181c; border: none; font-weight: 600; }
  button.ghost { background: var(--panel); color: var(--text); border: 1px solid var(--line); font-weight: 400; }
  button:disabled { opacity: .5; }
  nav { display: flex; border-bottom: 1px solid var(--line); flex-shrink: 0; }
  nav button {
    flex: 1; background: none; color: var(--dim); border: none; border-radius: 0;
    border-bottom: 2px solid transparent; padding: 12px; font-weight: 500; letter-spacing: .06em;
  }
  nav button.on { color: var(--text); border-bottom-color: var(--accent); }
  #log { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
  .msg { max-width: 88%; }
  .msg .who { color: var(--dim); font-size: 12px; margin-bottom: 2px; }
  .msg .body {
    background: var(--panel); padding: 8px 11px; border-radius: 12px;
    white-space: pre-wrap; word-wrap: break-word;
  }
  .msg.mine { align-self: flex-end; }
  .msg.mine .body { background: #33405e; }
  #controls { flex: 1; overflow-y: auto; padding: 14px; display: flex; flex-direction: column; gap: 14px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 14px; padding: 14px; }
  .card h2 { margin: 0 0 4px; font-size: 16px; font-weight: 600; }
  .card .sub { color: var(--dim); font-size: 13px; margin-bottom: 10px; }
  .row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 10px 0; border-top: 1px solid var(--line);
  }
  .row:first-of-type { border-top: none; }
  .switch { position: relative; width: 50px; height: 28px; flex-shrink: 0; }
  .switch input { opacity: 0; width: 100%; height: 100%; margin: 0; }
  .slider {
    position: absolute; inset: 0; background: #3a3d44; border-radius: 999px;
    transition: background .15s; pointer-events: none;
  }
  .slider::after {
    content: ""; position: absolute; width: 22px; height: 22px; border-radius: 50%;
    background: #e6e7ea; top: 3px; left: 3px; transition: transform .15s;
  }
  .switch input:checked + .slider { background: var(--accent); }
  .switch input:checked + .slider::after { transform: translateX(22px); }
  .wiring { color: var(--dim); font-size: 13px; margin-top: 8px; }
  footer {
    display: flex; gap: 8px; padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    border-top: 1px solid var(--line); flex-shrink: 0;
  }
  textarea { flex: 1; resize: none; max-height: 120px; }
  #login { margin: auto; padding: 24px; display: flex; flex-direction: column; gap: 12px; width: min(340px, 90vw); }
  #login h1 { font-size: 18px; font-weight: 600; margin: 0 0 4px; letter-spacing: .08em; }
  .note { color: var(--dim); font-size: 13px; }
  .hide { display: none !important; }
  #toast {
    position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%);
    background: #33405e; padding: 8px 14px; border-radius: 999px; font-size: 14px;
    opacity: 0; transition: opacity .2s; pointer-events: none;
  }
  #toast.on { opacity: 1; }
</style>
</head>
<body>

<div id="login">
  <h1>server panel</h1>
  <p class="note">the password is whatever you put in PANEL_PASSWORD.</p>
  <input id="pw" type="password" placeholder="password" autocomplete="current-password">
  <button onclick="login()">log in</button>
  <p class="note" id="loginerr"></p>
</div>

<nav class="hide" id="tabs">
  <button id="tab-chat" class="on" onclick="showTab('chat')">chat</button>
  <button id="tab-controls" onclick="showTab('controls')">controls</button>
</nav>

<header class="hide" id="bar">
  <select id="channel" onchange="loadHistory()"></select>
  <button class="ghost" onclick="loadHistory()">refresh</button>
</header>

<div id="log" class="hide"></div>
<div id="controls" class="hide"></div>

<footer class="hide" id="composer">
  <textarea id="text" rows="1" placeholder="type here, it sends as the bot"></textarea>
  <button id="sendbtn" onclick="send()">send</button>
</footer>

<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let tab = "chat";

function toast(text) {
  const el = $("toast");
  el.textContent = text;
  el.classList.add("on");
  setTimeout(() => el.classList.remove("on"), 1800);
}

async function api(path, options) {
  const res = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options));
  if (res.status === 401) { showLogin(); throw new Error("unauthorised"); }
  return res.json();
}

function showLogin() {
  $("login").classList.remove("hide");
  ["tabs", "bar", "log", "controls", "composer"].forEach(id => $(id).classList.add("hide"));
}

function showTab(which) {
  tab = which;
  $("tab-chat").classList.toggle("on", which === "chat");
  $("tab-controls").classList.toggle("on", which === "controls");
  ["bar", "log", "composer"].forEach(id => $(id).classList.toggle("hide", which !== "chat"));
  $("controls").classList.toggle("hide", which !== "controls");
  if (which === "controls") loadControls(); else loadHistory();
}

async function login() {
  const body = JSON.stringify({ password: $("pw").value });
  const res = await fetch("/api/login", { method: "POST", headers: { "Content-Type": "application/json" }, body });
  if (!res.ok) { $("loginerr").textContent = "that password is wrong"; return; }
  await boot();
}

async function boot() {
  const who = await (await fetch("/api/whoami")).json();
  if (!who.authed) { showLogin(); return; }
  $("login").classList.add("hide");
  $("tabs").classList.remove("hide");
  showTab("chat");

  const data = await api("/api/channels");
  const select = $("channel");
  select.innerHTML = "";
  for (const channel of data.channels) {
    const option = document.createElement("option");
    option.value = channel.id;
    option.textContent = `${channel.guild} / ${channel.name}`;
    select.appendChild(option);
  }
  if (data.channels.length) loadHistory();
}

async function loadHistory() {
  const id = $("channel").value;
  if (!id || tab !== "chat") return;
  const data = await api("/api/history?channel=" + id);
  const log = $("log");
  log.innerHTML = "";
  for (const message of (data.messages || [])) {
    const wrap = document.createElement("div");
    wrap.className = "msg" + (message.mine ? " mine" : "");
    const who = document.createElement("div");
    who.className = "who";
    who.textContent = `${message.author} - ${message.at}`;
    const body = document.createElement("div");
    body.className = "body";
    body.textContent = message.content || "(no text)";
    wrap.append(who, body);
    log.appendChild(wrap);
  }
  log.scrollTop = log.scrollHeight;
}

async function loadControls() {
  const data = await api("/api/guilds");
  const host = $("controls");
  host.innerHTML = "";
  if (!(data.guilds || []).length) {
    host.innerHTML = '<p class="note">the bot is not in any servers yet.</p>';
    return;
  }
  for (const guild of data.guilds) {
    const card = document.createElement("div");
    card.className = "card";

    const title = document.createElement("h2");
    title.textContent = guild.name;
    const sub = document.createElement("div");
    sub.className = "sub";
    sub.textContent = `${guild.members} members - ${guild.channels} text channels - ${guild.tickets_opened} tickets opened`;
    card.append(title, sub);

    for (const [key, label] of Object.entries(data.toggles)) {
      const row = document.createElement("div");
      row.className = "row";
      const name = document.createElement("span");
      name.textContent = label;

      const wrap = document.createElement("label");
      wrap.className = "switch";
      const input = document.createElement("input");
      input.type = "checkbox";
      input.checked = !!guild.toggles[key];
      input.onchange = () => setToggle(guild.id, key, input.checked, label);
      const slider = document.createElement("span");
      slider.className = "slider";
      wrap.append(input, slider);

      row.append(name, wrap);
      card.appendChild(row);
    }

    const wiring = document.createElement("div");
    wiring.className = "wiring";
    wiring.textContent = Object.entries(guild.wiring)
      .map(([label, channel]) => `${label}: ${channel ? "#" + channel : "not set"}`)
      .join("   ");
    card.appendChild(wiring);

    host.appendChild(card);
  }
}

async function setToggle(guild, key, value, label) {
  const result = await api("/api/setting", {
    method: "POST",
    body: JSON.stringify({ guild, key, value })
  });
  if (result.error) { toast(result.error); loadControls(); }
  else { toast(`${label} ${value ? "on" : "off"}`); }
}

async function send() {
  const content = $("text").value.trim();
  if (!content) return;
  $("sendbtn").disabled = true;
  try {
    const result = await api("/api/send", {
      method: "POST",
      body: JSON.stringify({ channel: $("channel").value, content })
    });
    if (result.error) { toast(result.error); }
    else { $("text").value = ""; await loadHistory(); }
  } finally {
    $("sendbtn").disabled = false;
  }
}

$("text").addEventListener("keydown", (event) => {
  if (event.key === "Enter" && !event.shiftKey) { event.preventDefault(); send(); }
});
$("pw").addEventListener("keydown", (event) => { if (event.key === "Enter") login(); });

boot();
setInterval(() => { if (tab === "chat" && !$("log").classList.contains("hide")) loadHistory(); }, 15000);
</script>
</body>
</html>
