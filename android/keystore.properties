# Signing key for the panel app.
#
# This is deliberately committed. It is not a password to anything - it only
# signs this one sideloaded app, so that when you rebuild it later Android sees
# the same signature and installs it as an update instead of making you
# uninstall first. The app holds no secrets: your bot token stays on the machine
# running the bot, and the panel password is typed in each time, not baked in.
#
# If you would rather have your own key, delete keystore/panel.p12, make a new
# one with keytool, and put its details here. Do that before you install the
# app the first time, or you will have to uninstall to switch keys.
storeFile=keystore/panel.p12
storePassword=panelpanel
keyAlias=panel
keyPassword=panelpanel
